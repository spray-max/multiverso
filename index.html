<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiverso Oficial - Wiki</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#000;
background-image: radial-gradient(white 1px, transparent 1px), radial-gradient(white 1px, transparent 1px);
background-size: 50px 50px, 80px 80px;
background-position: 0 0, 25px 25px;
color:#fff;font-family:Arial, sans-serif;padding:20px;min-height:100vh;
}
body::before{
content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center, #0a0a2a 0%, #000 70%);z-index:-1;
}
header{text-align:center;padding:30px;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:20px;margin-bottom:20px;border:1px solid #ffffff20}
header h1{font-size:42px;text-shadow:0 0 10px #00ffff}
header p{font-size:16px;margin-top:8px;color:#00ffff;letter-spacing:2px}
#search{width:100%;padding:15px;border-radius:30px;border:1px solid #ffffff30;background:rgba(255,255,255,0.1);color:#fff;font-size:16px;margin-bottom:30px;backdrop-filter:blur(5px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:25px}
.planet-card{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:0.3s}
.planet-card:hover{transform:scale(1.1) translateY(-5px)}
.planet{
width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-weight:bold;font-size:16px;position:relative;
}
.planet-card h2{margin-top:12px;font-size:14px;color:#fff;text-align:center}
.planet-card .status{font-size:11px;color:#aaa;text-align:center;margin-top:5px;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.c-earth{
background: url('https://upload.wikimedia.org/wikipedia/commons/6/6f/Earth_Eastern_Hemisphere.jpg');
background-size: cover;background-position: center;
box-shadow: inset -20px -20px 40px rgba(0,0,0,0.9), 0 0 30px #4a90e2;
color:transparent;border-radius:50%;
}

.c-blue{
background: radial-gradient(circle at 30% 30%, #00f, #004, #000);
box-shadow: inset -15px -15px 30px rgba(0,0,0,0.5), 0 0 15px rgba(0,0,255,0.6);
color:#fff;     
}

.c-white{
background: radial-gradient(circle at 30% 30%, #ffffff, #e0e0e0, #999999);
box-shadow: inset -15px -15px 30px rgba(0,0,0,0.5), 0 0 15px rgba(255,255,255,0.6);
color:#000;
}

.c-explosion{
background: url('https://upload.wikimedia.org/wikipedia/commons/7/73/Fireball.svg');
background-color: #000;
background-size: 160%;
background-position: center;
box-shadow: 0 0 20px #ff4400;
color:#fff;
text-shadow: 0 0 5px #000;
border-radius:50%;
animation: pulse 1s infinite alternate;
}
@keyframes pulse{from{box-shadow:0 0 10px #ff4400}to{box-shadow:0 0 25px #ff8800}}

#modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modalBox{background:#10102a;width:100%;max-width:600px;border-radius:16px;padding:30px;border:1px solid #333;text-align:center;position:relative}
.close{position:absolute;top:15px;right:20px;font-size:28px;cursor:pointer}
</style>
</head>
<body>

const grid=document.getElementById('grid');
function render(filter=""){
grid.innerHTML="";
dims.filter(d=> (d.id+d.status).toLowerCase().includes(filter.toLowerCase())).forEach(d=>{
const div=document.createElement('div');
div.className=`planet-card`;
div.innerHTML=`<div class="planet ${d.cls}">${d.id==="A-00"?"":d.id}</div><h2>${d.id}</h2><div class="status">${d.status}</div>`;
div.onclick=()=>openModal(d);
grid.appendChild(div);
});
}
function openModal(d){
document.getElementById('mId').innerText=d.id;
document.getElementById('mStatus').innerText=d.status;
document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}
render();
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
